<style>
body{margin:0}
a{color:#141A16}a:hover{color:#A84A2E}
.btn{position:relative;overflow:hidden;isolation:isolate;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,background-color .3s,color .3s,border-color .3s,filter .25s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-130%);pointer-events:none}
.btn:focus-visible{outline:3px solid #E8C9A8;outline-offset:3px}
.btn-primary:hover{filter:brightness(1.12);box-shadow:0 12px 28px rgba(168,74,46,.4)}
.btn-dark:hover{background-color:#A84A2E !important;box-shadow:0 12px 28px rgba(168,74,46,.35)}
.btn-ghost:hover{background-color:#FAFAF7 !important;color:#141A16 !important;border-color:#FAFAF7 !important}
.btn-light:hover{box-shadow:0 0 0 3px rgba(232,201,168,.55)}
.wine-card .bottle{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.wine-card:hover .bottle{transform:translateY(-12px) rotate(-4deg)}
.logo-crest{transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s}
.logo-link:hover .logo-crest,.logo-link:focus-visible .logo-crest{transform:rotate(-8deg) scale(1.08);filter:drop-shadow(0 0 10px rgba(232,201,168,.6))}
@media (prefers-reduced-motion: no-preference){
.btn::after{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.btn:hover::after{transform:translateX(130%)}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:none}
}
html{-webkit-text-size-adjust:100%}
h1,h2,h3,h4,h5{overflow-wrap:break-word}
@media (max-width: 599px){
.nav-desktop{display:none!important}
.logo-crest{height:44px!important}
.w-hero-img{height:440px!important}
.w-hero-img svg.bottle{height:300px!important;width:90px!important}
.facts-row{grid-template-columns:minmax(0,1fr)!important;gap:2px!important}
.sticky-buy{display:flex!important}
.w-footer{padding-bottom:84px}
}
</style>
<style>
.draft-note{background:#A84A2E;color:#fff;font:600 13px/1.4 Manrope,system-ui,sans-serif;text-align:center;padding:7px 16px}
</style>

<body>

<div id="app"></div>
<template id="dc-template">
<div style="font-family: Manrope, system-ui, sans-serif; color: #141A16; background: #FAFAF7; font-size: 16px; line-height: 1.6; overflow-x: clip">

<!-- Header -->
<header style="background: #141A16; color: #FAFAF7">
<div style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(16px, 4vw, 28px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
<a href="index.html" class="logo-link" aria-label="Bekauri Family Vineyards – Startseite" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: #FAFAF7">
<img src="assets/crest-light.png" alt="" class="logo-crest" style="height: 56px; width: auto">
<span style="display: flex; flex-direction: column; line-height: 1">
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: 0.08em">BEKAURI</span>
<span style="font-size: 10px; letter-spacing: 0.3em; margin-top: 5px; color: #C9D0C5">FAMILY VINEYARDS</span>
</span>
</a>
<nav class="nav-desktop" aria-label="Hauptnavigation" style="display: flex; flex-wrap: wrap; gap: 4px 30px; font-size: 15px">
<a href="index.html" style="color: #E6EAE3; text-decoration: none; padding: 10px 0">Georgische Weine</a>
<a href="index.html" style="color: #E6EAE3; text-decoration: none; padding: 10px 0">Weinwissen</a>
<a href="index.html" style="color: #E6EAE3; text-decoration: none; padding: 10px 0">Weingut</a>
<a href="index.html" style="color: #E6EAE3; text-decoration: none; padding: 10px 0">Kontakt</a>
</nav>
<a href="#" class="btn btn-light" aria-label="Warenkorb, {{cartCount}} Artikel" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #141A16; background: #FAFAF7; border-radius: 999px; padding: 10px 16px; min-height: 44px; box-sizing: border-box">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141A16" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
<span style="font-weight: 700">{{cartCount}}</span>
</a>
</div>
</header>

<!-- Breadcrumb -->
<nav aria-label="Brotkrumen" style="max-width: 1280px; margin: 0 auto; padding: 22px clamp(16px, 4vw, 28px) 0; font-size: 14px; color: #4B524C">
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 10px">
<li><a href="index.html" style="color: #4B524C">Startseite</a> ›</li>
<li><a href="index.html" style="color: #4B524C">Georgische Weine</a> ›</li>
<li><a href="index.html" style="color: #4B524C">{{w.estate}}</a> ›</li>
<li aria-current="page" style="color: #141A16; font-weight: 600">{{w.name}} {{w.year}}</li>
</ol>
</nav>

<!-- Produkt -->
<section style="padding: clamp(16px, 2.22vw, 32px) clamp(16px, 4vw, 28px) clamp(44px, 6.11vw, 88px)">
<div style="max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: clamp(28px, 3.89vw, 56px); align-items: start">
<div style="display: flex; flex-direction: column; gap: 14px">
<div class="w-hero-img" style="background: {{w.bg}}; border-radius: 32px; height: 640px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative">
<span style="position: absolute; top: 20px; left: 20px; z-index: 1; background: #FAFAF7; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 999px">{{w.photoLabel}}</span>
<sc-if value="{{w.own}}" hint-placeholder-val="{{ true }}">
<img src="assets/crest-dark.png" alt="Eigener Wein von Bekauri Family Vineyards" style="position: absolute; top: 16px; right: 20px; z-index: 1; width: 56px; height: auto">
</sc-if>
<sc-if value="{{w.hasImg}}" hint-placeholder-val="{{ true }}"><img class="bottle" src="{{w.img}}" alt="{{w.alt}}" style="{{w.bigStyle}}"></sc-if>
<sc-if value="{{w.noImg}}" hint-placeholder-val="{{ false }}"><svg class="bottle" role="img" aria-label="{{w.alt}}" viewBox="0 0 60 200" style="width: 128px; height: 428px"><path d="M24 0h12v10h-1v40c0 8 17 18 17 34v108c0 4-3 8-8 8H16c-5 0-8-4-8-8V84c0-16 17-26 17-34V10h-1z" fill="{{w.color}}"/><rect x="23" y="0" width="14" height="24" rx="2" fill="#141A16"/><rect x="12" y="116" width="36" height="50" rx="2" fill="#FAFAF7"/><rect x="20" y="128" width="20" height="3" fill="#141A16"/><rect x="22" y="136" width="16" height="2" fill="#7A817B"/></svg></sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<div style="background: #ECE8E1; border-radius: 18px; height: 120px; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; font-size: 12px; font-weight: 700; color: #4B524C">Etikett</div>
<div style="background: #ECE8E1; border-radius: 18px; height: 120px; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; font-size: 12px; font-weight: 700; color: #4B524C">Im Glas</div>
<div style="background: #ECE8E1; border-radius: 18px; height: 120px; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; font-size: 12px; font-weight: 700; color: #4B524C">Weinberg</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 24px; padding-top: 8px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #A84A2E; font-weight: 700">{{w.estate}}</span>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(34px, 5vw, 72px); line-height: 1">{{w.name}} {{w.year}}</h1>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="font-size: 13px; font-weight: 700; padding: 5px 14px; border-radius: 999px; background: #141A16; color: #FAFAF7">{{w.kind}}</span>
<span style="font-size: 13px; font-weight: 700; padding: 5px 14px; border-radius: 999px; background: #ECE8E1">{{w.taste}}</span>
<span style="font-size: 13px; font-weight: 700; padding: 5px 14px; border-radius: 999px; background: #ECE8E1">{{w.grape}}</span>
</div>
</div>
<p style="margin: 0; font-size: 19px; color: #3A413B">{{w.lead}}</p>
<div style="display: flex; align-items: baseline; gap: 12px">
<span style="font-size: 40px; font-weight: 700; line-height: 1">€ {{w.price}}</span>
<span style="color: #4B524C; font-size: 14px">0,75 l · {{w.perLiter}} · inkl. MwSt.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<div role="group" aria-label="Menge" style="display: flex; align-items: center; border: 1px solid #C9C3B8; border-radius: 999px; background: #FFFFFF">
<button type="button" onClick="{{dec}}" aria-label="Menge verringern" style="font: inherit; font-size: 22px; width: 52px; height: 52px; border: 0; background: transparent; cursor: pointer; border-radius: 999px">−</button>
<span aria-live="polite" style="min-width: 36px; text-align: center; font-weight: 700; font-size: 18px">{{qty}}</span>

</div>
<button type="button" onClick="{{add}}" class="btn btn-dark" style="flex: 1 1 240px; font: inherit; font-weight: 700; font-size: 17px; background: #141A16; color: #FAFAF7; border: 0; border-radius: 999px; padding: 15px clamp(16px, 4vw, 28px); min-height: 52px; cursor: pointer">{{addLabel}}</button>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; font-size: 15px">
<li style="display: flex; gap: 10px; align-items: center; background: #FFFFFF; border: 1px solid #E2DDD4; border-radius: 16px; padding: 14px 16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E4A33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>{{w.origin}}</li>
<li style="display: flex; gap: 10px; align-items: center; background: #FFFFFF; border: 1px solid #E2DDD4; border-radius: 16px; padding: 14px 16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E4A33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v10H3zM16 10h3l2 3v4h-5"/><circle cx="7" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>Exklusiv in AT &amp; DE</li>
<li style="display: flex; gap: 10px; align-items: center; background: #FFFFFF; border: 1px solid #E2DDD4; border-radius: 16px; padding: 14px 16px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E4A33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Beratung: +43 676 411 77 99</li>
</ul>
</div>
</div>
</section>

<!-- Beschreibung & Steckbrief -->
<section style="background: #ECE8E1; padding: clamp(44px, 6.11vw, 88px) clamp(16px, 4vw, 28px)">
<div style="max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: clamp(28px, 3.89vw, 56px); align-items: start">
<div style="display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(36px, 4vw, 52px); line-height: 1.05">Über diesen Wein</h2>
<p style="margin: 0; font-size: 18px; color: #3A413B">{{w.desc}}</p>
<div style="display: flex; flex-direction: column; gap: 12px">

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 12px">
<div style="border: 1.5px dashed #B8B0A3; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #A84A2E">Farbe</span><span style="color: #4B524C">[vom Weingut ergänzen]</span></div>
<div style="border: 1.5px dashed #B8B0A3; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #A84A2E">Nase</span><span style="color: #4B524C">[vom Weingut ergänzen]</span></div>
<div style="border: 1.5px dashed #B8B0A3; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: #A84A2E">Gaumen</span><span style="color: #4B524C">[vom Weingut ergänzen]</span></div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px">
<div style="background: #FAFAF7; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; gap: 8px; align-items: center; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A84A2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16M6 11a6 6 0 0 0 12 0M9 4v4M12 3v5M15 4v4"/></svg>Passt zu</span>
<span style="color: #4B524C">{{w.food}}</span>
</div>
<div style="background: #FAFAF7; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; gap: 8px; align-items: center; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A84A2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V4a2 2 0 1 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg>Trinktemperatur</span>
<span style="color: #4B524C">{{w.temp}} (Empfehlung)</span>
</div>
</div>
</div>
<div style="background: #FAFAF7; border-radius: 28px; padding: clamp(16px, 2.22vw, 32px); display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0 0 12px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 32px">Steckbrief</h2>
<dl style="margin: 0; display: flex; flex-direction: column">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="9">
<div class="facts-row" style="display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-top: 1px solid #E2DDD4">
<dt style="color: #4B524C; font-weight: 500">{{f.k}}</dt>
<dd style="margin: 0; font-weight: 600">{{f.v}}</dd>
</div>
</sc-for>
</dl>
</div>
</div>
</section>

<!-- Video -->
<section style="background: #141A16; color: #FAFAF7; padding: clamp(48px, 6.67vw, 96px) clamp(16px, 4vw, 28px)">
<div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #E39A7E; font-weight: 700">Weinpräsentation</p>
<h2 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(36px, 4vw, 56px); line-height: 1.05">{{w.name}} {{w.year}} im Video</h2>
</div>
<div style="position: relative; aspect-ratio: 16 / 9; background: #1E2820; border: 1px solid #2C382F; border-radius: 28px; overflow: hidden; display: flex; align-items: center; justify-content: center">
<span style="position: absolute; top: 18px; left: 18px; background: #FAFAF7; color: #141A16; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 999px">Videoplatz · YouTube, Vimeo oder MP4</span>
<sc-if value="{{notPlaying}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
<button type="button" onClick="{{play}}" class="btn btn-primary" aria-label="Video zu {{w.name}} {{w.year}} abspielen" style="width: 96px; height: 96px; border-radius: 999px; border: 0; background: #A84A2E; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5v14l11-7z"/></svg>
</button>
<span style="color: #C9D0C5">ca. 2–3 Minuten</span>
</div>
</sc-if>
<sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 24px">
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px">Hier läuft später die Weinpräsentation.</span>
<button type="button" onClick="{{stop}}" class="btn btn-ghost" style="font: inherit; font-weight: 600; color: #FAFAF7; background: transparent; border: 1px solid #5B6B5F; border-radius: 999px; padding: 12px 24px; min-height: 44px; cursor: pointer">Schließen</button>
</div>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">

<span style="border: 1px solid #2C382F; border-radius: 999px; padding: 8px 16px; font-size: 14px">00:40 Rebsorte &amp; Ausbau</span>
<span style="border: 1px solid #2C382F; border-radius: 999px; padding: 8px 16px; font-size: 14px">01:20 Verkostung</span>

</div>
</div>
</section>

<!-- Weitere Weine -->
<section style="padding: clamp(48px, 6.67vw, 96px) clamp(16px, 4vw, 28px)">

</div>
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1.1">{{r.name}} {{r.year}}</span>
<span style="font-weight: 700">€ {{r.price}}</span>
</a>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 24px; border-top: 1px solid #E2DDD4">
<a href="{{prev.page}}" style="font-weight: 700; padding: 12px 0">← {{prev.label}}</a>
<a href="{{next.page}}" style="font-weight: 700; padding: 12px 0">{{next.label}} →</a>
</div>
</div>
</section>
